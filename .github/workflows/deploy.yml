name: Deploy a Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build y despliegue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar acceso a Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID en los secretos de GitHub."
            exit 1
          fi
          if ! npx wrangler pages project list >/dev/null; then
            echo "El token no puede consultar Cloudflare Pages."
            echo "Crea un token con Account > Cloudflare Pages > Edit y actualiza CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Verificar / crear base de datos D1 e inyectar database_id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_NAME="sistema-econ-3e2-db"
          DB_ID=$(npx wrangler d1 list --json 2>/dev/null | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              try{
                const list=JSON.parse(d);
                const found=list.find(x=>x.name==='$DB_NAME');
                console.log(found ? (found.uuid || found.id) : '');
              }catch(e){console.log('');}
            });
          ")
          if [ -z "$DB_ID" ]; then
            echo "No existe la base; creándola..."
            OUT=$(npx wrangler d1 create "$DB_NAME")
            echo "$OUT"
            DB_ID=$(echo "$OUT" | grep -oE '[a-f0-9-]{32,36}' | head -1)
          fi
          echo "database_id = $DB_ID"
          DB_ID="$DB_ID" node -e "
            const fs=require('fs');
            let s=fs.readFileSync('wrangler.toml','utf8');
            s=s.replace(/database_id\s*=\s*\".*?\"/, 'database_id = \"' + process.env.DB_ID + '\"');
            fs.writeFileSync('wrangler.toml',s);
          "

      - name: Aplicar esquema a D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute sistema-econ-3e2-db --remote --yes --file=./schema.sql

      - name: Verificar / crear bucket de facturas (R2) - OPCIONAL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BUCKET="sistema-econ-3e2-facturas"
          # Si R2 no esta habilitado, `bucket list` falla con [code: 10042].
          # No fallamos el deploy: la app maneja 503 y avisa al usuario.
          if ! npx wrangler r2 bucket list >/dev/null 2>&1; then
            echo "::warning::R2 no esta habilitado en la cuenta. Las subidas de facturas fallaran con 503 hasta que se active (Dashboard > R2 > Get started)."
            exit 0
          fi
          if npx wrangler r2 bucket list 2>/dev/null | grep -q "$BUCKET"; then
            echo "Bucket $BUCKET ya existe."
          else
            echo "Creando bucket $BUCKET..."
            npx wrangler r2 bucket create "$BUCKET"
          fi
        continue-on-error: true

      - name: Compilar
        run: npm run build

      - name: Crear proyecto de Pages si no existe
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create sistema-econ-3e2 --production-branch=main
        continue-on-error: true

      - name: Desplegar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sistema-econ-3e2 --branch=main

      - name: Comprobar el secreto de sesión
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Sin SESSION_SECRET, auth.js cae en silencio al literal hardcodeado.
          if npx wrangler pages secret list --project-name=sistema-econ-3e2 2>/dev/null | grep -q SESSION_SECRET; then
            echo "SESSION_SECRET configurado."
          else
            echo "::warning::SESSION_SECRET no esta definido en Pages. El login usara un valor por defecto compartido. Defínelo con: npx wrangler pages secret put SESSION_SECRET --project-name=sistema-econ-3e2"
          fi